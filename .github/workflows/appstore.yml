name: App Store Connect (status / fill / submit)

# Runs scripts/appstore.py with the App Store API key. Triggered by pushing the `appstore-run`
# branch; the action (status | fill | submit) is the first word of appstore/ACTION.
# The result (out/status.json, no private data) is pushed to the `appstore-result` branch.

on:
  push:
    branches: [appstore-run]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
      APPSTORE_KEY_BASE64: ${{ secrets.APPSTORE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run
        run: |
          pip install --quiet pyjwt cryptography requests
          KEY="$RUNNER_TEMP/AuthKey.p8"
          if [ -n "$APPSTORE_KEY" ]; then printf '%s\n' "$APPSTORE_KEY" > "$KEY"; else echo "$APPSTORE_KEY_BASE64" | base64 --decode > "$KEY"; fi
          python3 - "$KEY" <<'PY'
          import re, sys, textwrap
          p = sys.argv[1]; t = open(p, encoding="utf-8-sig", errors="ignore").read()
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", t)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          open(p, "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          PY
          ACTION=$(awk '{print $1; exit}' appstore/ACTION)
          echo "Action: $ACTION"
          set +e
          ASC_KEY_PATH="$KEY" python3 scripts/appstore.py "$ACTION"
          echo "exit=$?"
          rm -f "$KEY"
          mkdir -p out
          exit 0

      - name: Publish result
        if: always()
        run: |
          OUT="$RUNNER_TEMP/result"; mkdir -p out && rm -rf "$OUT" && cp -R out "$OUT"
          echo "run ${{ github.run_number }} for ${{ github.sha }}" > "$OUT/RUN.txt"
          cd "$OUT"
          git init -q -b appstore-result
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "App Store result for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" appstore-result
