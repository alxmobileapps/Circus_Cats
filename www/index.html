<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f45" />
  <title>Circus Cats</title>
  <style>
    :root { --ad-h: 0px; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #0a1f45;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    /* Portrait game frame: full screen on phones, phone-shaped on wide screens */
    canvas {
      position: fixed; left: 50%; transform: translateX(-50%);
      top: var(--ad-h);
      height: calc(100vh - var(--ad-h));
      width: min(100vw, calc((100vh - var(--ad-h)) * 0.6));
      display: block;
    }
    #adph {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      height: var(--ad-h); width: min(100vw, calc((100vh - var(--ad-h)) * 0.6));
      display: flex; align-items: center; justify-content: center;
      background: #d9d4d6; color: #5a4a50; font: 600 13px system-ui, sans-serif;
    }
    #adph[hidden] { display: none; }
    /* iPhone: keep the game clear of the notch / Dynamic Island and the home bar */
    html.ios { --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
    html.ios canvas {
      top: calc(var(--ad-h) + var(--safe-t));
      height: calc(100vh - var(--ad-h) - var(--safe-t) - var(--safe-b));
      width: min(100vw, calc((100vh - var(--ad-h) - var(--safe-t) - var(--safe-b)) * 0.6));
    }
  </style>
</head>
<body>
  <div id="adph" hidden>Ad banner (live ads show in the phone app)</div>
  <canvas id="game"></canvas>
  <script src="vendor/capacitor.js"></script>
  <script>try { if (window.Capacitor && Capacitor.getPlatform() === 'ios') document.documentElement.classList.add('ios'); } catch (e) {}</script>
  <script src="ads-config.js"></script>
  <script src="breeds.js"></script>
  <script src="ads.js"></script>
  <script src="game.js"></script>
</body>
</html>
